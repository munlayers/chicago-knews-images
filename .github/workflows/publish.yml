name: 인스타 예약 게시

on:
  schedule:
    # GitHub 예약은 자주 늦어서, 게시 시각 약 35분·20분 전에 두 번 미리 깨워요 (UTC 기준)
    # 아침 7:00 시카고 = 겨울 13:00 UTC / 여름 12:00 UTC
    - cron: "23 12 * * *"
    - cron: "38 12 * * *"
    - cron: "23 11 * * *"
    - cron: "38 11 * * *"
    # 점심 12:00 시카고 = 겨울 18:00 UTC / 여름 17:00 UTC
    - cron: "23 17 * * *"
    - cron: "38 17 * * *"
    - cron: "23 16 * * *"
    - cron: "38 16 * * *"
    # 혹시 놓쳤을 때를 위한 1시간마다 확인
    - cron: "7 * * * *"
  workflow_dispatch:          # 수동 실행 버튼
  push:
    paths: ["queue/**"]       # 저녁에 새 게시물이 올라오면 바로 한 번 확인

permissions:
  contents: write             # 게시 결과(post.json)를 저장하기 위해 필요

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # 게시 시각까지 기다리는 시간 포함
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # 예약 시점의 옛 기록이 아니라 '지금' 최신 기록으로 확인 (중복 게시 방지)
      - name: 게시할 시간이 된 게시물 올리기
        run: python3 publisher/publish_queue.py
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: v27.0
      - name: 게시 결과 저장
        run: |
          git config user.name "chicago-knews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "게시 상태 업데이트"
            git pull --rebase
            git push
          fi
