name: 인스타 예약 게시

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 게시할 시간이 된 게시물이 있는지 확인
  workflow_dispatch:          # 수동 실행 버튼
  push:
    paths: ["queue/**"]       # 저녁에 새 게시물이 올라오면 바로 한 번 확인

permissions:
  contents: write             # 게시 결과(post.json)를 저장하기 위해 필요

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 게시할 시간이 된 게시물 올리기
        run: python3 publisher/publish_queue.py
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: v27.0
      - name: 게시 결과 저장
        run: |
          git config user.name "chicago-knews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "게시 상태 업데이트"
            git pull --rebase
            git push
          fi
